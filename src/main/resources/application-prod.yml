server:
  port: 8001

spring:
  datasource:
    url: jdbc:mysql://prod-host:3306/bmp_sysmanage?characterEncoding=utf8&useSSL=false
    username: root
    password: prod-password
    driver-class-name: com.mysql.jdbc.Driver
  redis:
    database: 0
    host: prod-redis-host
    port: 6379
    password: prod-redis-password
    jedis:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
      timeout: 3000

application:
  workerId: 1
  datacenterId: 1
