spring:
  application:
    name: Adventure
  profiles:
    active: dev
  thymeleaf:
    mode: LEGACYHTML5
    encoding: UTF-8
    servlet:
      content-type: text/html
    cache: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  resources:
    static-locations:
      - classpath:/static/
      - classpath:/views/
      - classpath:/META-INF/resources/webjars/
      - classpath:/META-INF/resources/

mybatis-plus:
  mapper-locations: classpath*:com/firstTry/Adventure/mapper/*Mapper.xml
  type-aliases-package: com.firstTry.Adventure.entity
